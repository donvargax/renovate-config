name: validate

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=npm depName=renovate
      RENOVATE_VERSION: 44.115.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # --strict also fails on a config Renovate would migrate.
      - run: >-
          npx --yes --package "renovate@$RENOVATE_VERSION" --
          renovate-config-validator --strict default.json vite-plus.json go.json renovate.json
